<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <title>UnicDB Generate Commit — bold blue U on sparkle frame</title>
  <!--
    Distinct from generic $(sparkle): four-point sparkle frame + bold blue
    "U" monogram. The U is intentionally large (≈75% of the frame) so it is
    legible at 16x16 toolbar size. Frame uses currentColor so VS Code can
    theme it for light/dark; the U stays UnicDB brand blue in both themes
    so the brand mark is consistent.
  -->
  <!-- Sparkle frame (4-point star) -->
  <path
    d="M12 1.4 L13.6 8.8 L20.4 10.4 L13.6 12 L12 19.6 L10.4 12 L3.6 10.4 L10.4 8.8 Z"
    fill="currentColor"
  />
  <!-- Bold U monogram, white over sparkle — scaled to fill more of the frame -->
  <path
    d="M7.6 5.2 L7.6 14.4 C7.6 16.95 9.55 18.7 12.4 18.7 C15.25 18.7 17.2 16.95 17.2 14.4 L17.2 5.2 L14.65 5.2 L14.65 14.25 C14.65 15.55 13.8 16.4 12.4 16.4 C11 16.4 10.15 15.55 10.15 14.25 L10.15 5.2 Z"
    fill="#1E88E5"
  />
</svg>
